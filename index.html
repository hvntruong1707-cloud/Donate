<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate cho Trường ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 25px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .heart {
            font-size: 45px;
        }

        .qr {
            width: 260px;
            max-width: 100%;
            border-radius: 15px;
            margin: 15px auto;
        }

        .info {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
        }

        .info p {
            margin: 8px 0;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .copy {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Donate cho Trường</h1>

    <p>Cảm ơn bạn đã ủng hộ mình!</p>

    <!-- QR CODE -->
    <img
        class="qr"
        src="qr.png"
        alt="QR Donate"
    >

    <div class="info">

        <p>
            <strong>Ngân hàng:</strong>
            Techcombank
        </p>

        <p>
            <strong>Số tài khoản:</strong>
            17079999999999
        </p>

        <p>
            <strong>Chủ tài khoản:</strong>
            HO VU NHAT 
        </p>

    </div>

    <p class="note">
        📱 Quét mã QR để donate<br>
        💬 Hãy để lại lời nhắn khi chuyển khoản
    </p>

</div>

</body>
</html>
